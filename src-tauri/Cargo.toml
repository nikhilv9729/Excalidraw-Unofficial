[package]
name = "unofficial-excalidraw-desktop"
version = "0.18.1"
description = "An unofficial Windows desktop client for Excalidraw"
authors = ["Excalidraw Desktop contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "excalidraw_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
