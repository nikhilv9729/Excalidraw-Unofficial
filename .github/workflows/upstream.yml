name: Check for Excalidraw updates

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Update the official Excalidraw package
        run: pnpm update @excalidraw/excalidraw --latest --save-exact
      - run: pnpm sync:version
      - run: pnpm build
      - name: Open an update pull request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Already current"
            exit 0
          fi
          version=$(node -p "require('./package.json').dependencies['@excalidraw/excalidraw']")
          branch="automation/excalidraw-${version}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add package.json pnpm-lock.yaml src-tauri/Cargo.toml src-tauri/tauri.conf.json
          git commit -m "Update Excalidraw to ${version}"
          git push --force-with-lease origin "$branch"
          gh pr create --fill --base "${{ github.event.repository.default_branch }}" --head "$branch" || true
